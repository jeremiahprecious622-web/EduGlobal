<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 64" role="img" aria-label="EduGlobal" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="eg-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DB0FF"/>
      <stop offset="1" stop-color="#168BFF"/>
    </linearGradient>
    <linearGradient id="eg-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#FFC83D"/>
    </linearGradient>
  </defs>

  <!-- Graduation cap -->
  <path d="M32 3 L53 11 L32 19 L11 11 Z" fill="url(#eg-gold)"/>
